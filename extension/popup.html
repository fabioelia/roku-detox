<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roku Detox</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 340px; padding: 14px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header img { width: 28px; height: 28px; }
  header .tv { margin-left: auto; text-align: right; font-size: 12px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .tv select { width: 150px; margin: 0; font-size: 12px; padding: 4px 6px; }
  .video-title { font-weight: 600; margin: 6px 0 2px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video-meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .actions { display: grid; gap: 8px; margin-top: 12px; }
  select { width: 100%; margin-top: 8px; font-size: 12.5px; }
  footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 12.5px; }
  footer .links { display: flex; gap: 12px; }
  .quick { margin-top: 10px; }
  /* Nothing to send from this tab: one quiet line instead of a big disabled button. */
  .video-card.idle { padding-top: 10px; padding-bottom: 10px; }
  .video-card.idle h2, .video-card.idle .actions, .video-card.idle .video-meta { display: none; }
  .video-card.idle .video-title { margin: 0; font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .status:empty { display: none; }
  .today { margin: -4px 0 8px; font-size: 12.5px; color: var(--muted); }
  .now { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; min-height: 1.2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .key {
    display: grid; place-items: center; height: 38px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--raised); color: inherit; cursor: pointer;
  }
  .key:hover:not(:disabled) { border-color: var(--muted); }
  .key:disabled { opacity: .45; cursor: default; }
  .key.sent { border-color: var(--keep); box-shadow: 0 0 0 2px var(--keep-soft, rgba(30, 140, 110, .25)); }
  .key svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .key svg.solid { fill: currentColor; stroke: none; }
  .key.power { color: #C2334D; }
  .hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
  .launch { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .launch:empty { display: none; }
  .say { margin-top: 10px; }
  .resume { margin-top: 10px; }
  .resume .btn { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .say input { width: 100%; font-size: 12.5px; }
  .launch button {
    max-width: 100%; min-height: 32px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--raised); color: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .launch button:hover:not(:disabled) { border-color: var(--muted); }
  .launch button.scene::before { content: "\25B6\FE0E"; margin-right: 6px; font-size: 10px; opacity: .7; }
</style>
</head>
<body>
  <header>
    <img src="icons/48.png" alt="">
    <h1>Roku Detox</h1>
    <p class="tv muted" id="tv">No TV yet</p>
  </header>

  <section class="card video-card" id="video-card" aria-labelledby="video-heading">
    <h2 id="video-heading">Video on this tab</h2>
    <p class="video-title" id="video-title">Looking…</p>
    <p class="video-meta" id="video-meta"></p>
    <select id="video-pick" hidden aria-label="Which video to send"></select>
    <div class="actions">
      <button class="btn primary wide" id="send" type="button" disabled>Send to TV</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section class="card quick" aria-label="Quick remote">
    <p class="now" id="now"></p>
    <p class="today" id="today" hidden></p>
    <div class="keys" id="keys" role="group" aria-label="TV remote">
      <button class="key" data-key="Back" type="button" aria-label="Back" disabled><svg viewBox="0 0 24 24"><path d="M9 6 3 12l6 6"/><path d="M3 12h11a6 6 0 0 1 6 6"/></svg></button>
      <button class="key" data-key="Home" type="button" aria-label="Home" disabled><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h12V9.5"/></svg></button>
      <button class="key power" data-key="Power" type="button" aria-label="Power" disabled><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.4 7.4a8 8 0 1 0 11.2 0"/></svg></button>
      <button class="key" data-key="Rev" type="button" aria-label="Rewind" disabled><svg class="solid" viewBox="0 0 24 24"><path d="M11 6v12l-8-6zM21 6v12l-8-6z"/></svg></button>
      <button class="key" data-key="Play" type="button" aria-label="Play or pause" disabled><svg class="solid" viewBox="0 0 24 24"><path d="M4 5.5v13l8.5-6.5zM15 6h2.5v12H15zM19.5 6H22v12h-2.5z"/></svg></button>
      <button class="key" data-key="Fwd" type="button" aria-label="Fast forward" disabled><svg class="solid" viewBox="0 0 24 24"><path d="M3 6v12l8-6zM13 6v12l8-6z"/></svg></button>
      <button class="key" data-key="VolumeDown" type="button" aria-label="Volume down" disabled><svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10z"/><path d="M16 12h5"/></svg></button>
      <button class="key" data-key="VolumeMute" type="button" aria-label="Mute" disabled><svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg></button>
      <button class="key" data-key="VolumeUp" type="button" aria-label="Volume up" disabled><svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10z"/><path d="M16 12h5M18.5 9.5v5"/></svg></button>
    </div>
    <div class="resume" id="resume" hidden>
      <button class="btn wide" type="button" id="resume-btn"></button>
    </div>
    <div class="launch" id="launch" aria-label="Your favorites and scenes"></div>
    <form class="say" id="say-form">
      <input type="text" id="say-input" placeholder="hdmi 2, sleep 30, what's on, a show…" aria-label="What to do on the TV" autocomplete="off" maxlength="2000" disabled>
    </form>
    <p class="hint">While this is open, arrow keys move, Enter is OK, Backspace is Back.</p>
  </section>

  <div class="actions">
    <button class="btn wide" id="open" type="button">Open Roku Detox</button>
  </div>

  <footer>
    <span class="links"><a href="options.html" id="options" target="_blank">Settings</a><a href="#" id="shortcuts">Keyboard shortcuts</a></span>
    <span class="muted" id="version"></span>
  </footer>
<script src="popup.js" type="module"></script>
</body>
</html>

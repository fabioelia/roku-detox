<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roku Detox</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 340px; padding: 14px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header img { width: 28px; height: 28px; }
  header .tv { margin-left: auto; text-align: right; font-size: 12px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .video-title { font-weight: 600; margin: 6px 0 2px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video-meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .actions { display: grid; gap: 8px; margin-top: 12px; }
  select { width: 100%; margin-top: 8px; font-size: 12.5px; }
  footer { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12.5px; }
</style>
</head>
<body>
  <header>
    <img src="icons/48.png" alt="">
    <h1>Roku Detox</h1>
    <p class="tv muted" id="tv">No TV yet</p>
  </header>

  <section class="card" aria-labelledby="video-heading">
    <h2 id="video-heading">Video on this tab</h2>
    <p class="video-title" id="video-title">Looking…</p>
    <p class="video-meta" id="video-meta"></p>
    <select id="video-pick" hidden aria-label="Which video to send"></select>
    <div class="actions">
      <button class="btn primary wide" id="send" type="button" disabled>Send to TV</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <div class="actions">
    <button class="btn wide" id="open" type="button">Open Roku Detox</button>
  </div>

  <footer>
    <a href="options.html" id="options" target="_blank">Settings</a>
    <span class="muted" id="version"></span>
  </footer>
<script src="popup.js" type="module"></script>
</body>
</html>
